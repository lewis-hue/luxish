[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "atelier-api"
version = "0.1.0"
description = "Atelier backend API — modular FastAPI service with durable workers (ADR-003)"
requires-python = ">=3.12,<3.13"
license = { text = "SEE LICENSE IN ../../LICENSE" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3",
  "sqlalchemy[asyncio]>=2.0.30,<2.1",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  # Keycloak-issued RS256/ES256 access tokens are verified against the realm
  # JWKS; we never issue tokens ourselves.
  "pyjwt[crypto]>=2.9,<3",
  # The Meta Model API is OpenAI-protocol-compatible and has no first-party
  # SDK, so it is called through this client with base_url pointed at
  # https://api.meta.ai/v1 (ADR-007). Imported lazily inside the adapter.
  "openai>=1.54",
  # Team-wide usage reservations are a single server-side EVAL; the in-memory
  # store in app/providers/base.py implements the same interface, so no test
  # and no single-process dev box needs a live Redis.
  "redis>=5.0,<7",
  # Compositing the sam-3.1 mask onto a solid ground (Task 11). Pillow does the
  # raster work; nothing here generates or re-synthesises image content.
  "pillow>=10",
  # Meta's own parser for sam-3.1's special-token output. The mask payload is
  # base85 and the published docs state neither the variant nor the
  # compression — they point at `decode_mask_to_raster` instead — so we
  # delegate rather than reverse-engineer it. **Pin >= 0.0.6**: earlier
  # releases report every line carrying an `include_confidence` `c=` field as
  # malformed and return no records, which is indistinguishable from "the model
  # found nothing". Imported lazily; its absence degrades to a labelled
  # capability gap rather than a crash (app/providers/segmentation.py).
  "meta-sam-parser>=0.0.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  # The unit suite runs on SQLite so it needs no server; see tests/conftest.py.
  "aiosqlite>=0.20",
  "greenlet>=3.0",
  # Only for the `postgres`-marked tests, which inspect a live PostgreSQL 16
  # schema synchronously (asyncpg has no sync driver).
  "psycopg[binary]>=3.1",
  "ruff>=0.6",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
minversion = "8.0"
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning:app.*"]
addopts = "-m 'not postgres and not live'"
markers = [
  "postgres: requires a live PostgreSQL 16 server (set ATELIER_TEST_PG_URL); excluded by default",
  "live: makes real, billable calls to the Meta Model API (set MODEL_API_KEY); excluded by default",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are *meant* to be evaluated in argument defaults —
# that is the framework's declaration syntax, not the mutable-default bug B008
# exists to catch. Without this, B008 fires inconsistently: it flagged
# `date: datetime.date | None = Query(...)` while allowing the identical pattern
# under a plain `str | None` annotation, which is a confusing rule to live with.
extend-immutable-calls = [
  "fastapi.Body",
  "fastapi.Cookie",
  "fastapi.Depends",
  "fastapi.File",
  "fastapi.Form",
  "fastapi.Header",
  "fastapi.Path",
  "fastapi.Query",
  "fastapi.Security",
]
