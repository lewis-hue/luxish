[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "atelier-api"
version = "0.1.0"
description = "Atelier backend API — modular FastAPI service with durable workers (ADR-003)"
requires-python = ">=3.12,<3.13"
license = { text = "SEE LICENSE IN ../../LICENSE" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3",
  "sqlalchemy[asyncio]>=2.0.30,<2.1",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  # Keycloak-issued RS256/ES256 access tokens are verified against the realm
  # JWKS; we never issue tokens ourselves.
  "pyjwt[crypto]>=2.9,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "aiosqlite>=0.20",
  "greenlet>=3.0",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
minversion = "8.0"
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning:app.*"]
addopts = "-m 'not postgres'"
markers = [
  "postgres: requires a live PostgreSQL 16 server (set ATELIER_TEST_PG_URL); excluded by default",
]

[tool.ruff]
target-version = "py312"
line-length = 100
