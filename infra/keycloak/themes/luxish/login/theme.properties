# The sign-in page, dressed like the app it signs you into.
#
# Extends keycloak.v2 rather than replacing it. Keycloak's login templates are
# FreeMarker and they change between releases; a theme that forks them owns
# every one of those changes forever, and owning them is how a login page
# quietly breaks on an upgrade. This one overrides stylesheets and nothing
# else, so a Keycloak upgrade brings its own markup fixes with it and the
# only thing we maintain is the appearance.
#
# `styles` replaces the parent's list rather than appending to it, so the
# parent's own sheet is named here first and ours loads after it. Resource
# lookup falls back to the parent, which is how css/styles.css resolves from
# a file we do not have.
parent=keycloak.v2
import=common/keycloak

styles=css/styles.css css/luxish.css

# The parent supports a dark variant and so does luxish.css, keyed off the
# same preference the app uses.
darkMode=true
