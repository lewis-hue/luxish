# Local development stack. Not a production topology — see infra/terraform for that.
#
# Ports are offset into the 55xxx range so this stack never collides with another
# project's Postgres/Redis/Keycloak already running on the standard ports.

name: luxish

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: luxish
      POSTGRES_PASSWORD: luxish
      POSTGRES_DB: luxish
    ports:
      - '55432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U luxish -d luxish']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    # Bounded memory with LRU eviction, matching how the API treats Redis: a cache
    # and a rate-limit store, never a system of record.
    command: >
      redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save ""
    ports:
      - '55379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # Keycloak >= 26.8.1 is a floor, not a preference: 26.8.1 fixed 22 CVEs, three of
  # them in identity brokering (CVE-2026-82968 wrong-account linking,
  # CVE-2026-15943 masked-secret reuse, CVE-2026-18569 forged logout tokens).
  # Captures every email the stack sends and shows it in a browser. Nothing
  # leaves the machine.
  #
  # Added because the realm keeps `verifyEmail: true`, which is right and must
  # stay right: registration sends a verification mail, and a local stack with
  # no SMTP fails it with "Failed to send email". Disabling verification would
  # have made local development stop exercising the flow that ships, so the
  # mail server is faked instead of the requirement.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 'true'
      MP_SMTP_AUTH_ALLOW_INSECURE: 'true'
    ports:
      # Read the mail at http://localhost:55026
      - '55026:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    # `start-dev` is development only — it forces local caches. Production uses
    # `start` with a real hostname and proxy configuration.
    # `--import-realm` is a CLI flag; there is no KC_IMPORT_REALM env var.
    command: ['start-dev', '--import-realm']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: luxish
      KC_DB_PASSWORD: luxish
      KC_HEALTH_ENABLED: 'true'
      # Only set when Keycloak is reached through a tunnel or proxy in local
      # development. Without KC_PROXY_HEADERS it cannot see that TLS was
      # terminated upstream, so it advertises http:// URLs over an https://
      # connection and every token carries an issuer the API will reject.
      # Empty by default, which is correct for plain localhost.
      KC_HOSTNAME: ${KC_HOSTNAME:-}
      KC_PROXY_HEADERS: ${KC_PROXY_HEADERS:-}
      # Referenced as ${...} inside luxish-realm.json, so no secret is ever
      # committed. Real values come from `infra/.env`, which is gitignored;
      # see infra/.env.example. The `:-unset` default keeps the stack bootable
      # without Google configured, in which case the Google button appears and
      # fails at Google rather than breaking the import.
      LUXISH_API_CLIENT_SECRET: local-dev-only-not-a-real-secret
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-unset}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-unset}
    ports:
      - '55080:8080'
      - '55000:9000' # management port: /health/ready lives here, not on 8080
    volumes:
      # The file MUST be named <realm-name>-realm.json or the import is skipped.
      # Subdirectories are ignored.
      - ./keycloak/import:/opt/keycloak/data/import:ro
      # The login theme. Mounted rather than baked into an image so editing
      # the stylesheet is a container restart, not a rebuild. Keycloak ships
      # its own themes inside a jar and leaves this directory empty, so there
      # is nothing here to shadow.
      - ./keycloak/themes:/opt/keycloak/themes:ro
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  # --------------------------------------------------------------- #
  # The backend, containerised.
  #
  # **So a reviewer needs Docker and Node, and not Python.** These
  # ran as local processes, which meant installing Python 3.12,
  # building a virtualenv and resolving fourteen dependencies before
  # the app would start - and a wrong version failed in ways that
  # looked like a broken app rather than a missing toolchain.
  #
  # One image for the API and all four workers. They import the same
  # modules and must run the same code: a worker lagging the API by
  # a rebuild is the stale-process bug this project has already paid
  # for twice.
  # --------------------------------------------------------------- #
  api:
    build:
      context: ../services/api
      dockerfile: Dockerfile
    image: luxish-api:local
    env_file: ../services/api/.env
    # **Anchored, because the workers must not drift from this.**
    #
    # The mannequin figures were mounted here and nowhere else. The
    # API could read them and the workers could not - and the workers
    # are where drawing happens, so every try-on by anybody without
    # their own avatar failed with "no mannequin file for
    # 'androgynous-average' and no default", surfaced on the phone as
    # "I could not draw that".
    #
    # One image already serves all five roles so a worker cannot run
    # different code. These anchors do the same for what it can see:
    # adding a mount here reaches every role, because copying a block
    # four times is how the last one gets forgotten.
    environment: &backend-env
      # Inside the compose network the stores answer on their service
      # names and standard ports, not the host's 55xxx offsets.
      LUXISH_REDIS_URL: redis://redis:6379/0
      LUXISH_DATABASE_URL: sqlite+aiosqlite:////data/luxish_dev.sqlite3
      # Named rather than inferred: the seed scripts used to count
      # directories up from __file__, which is an IndexError in a
      # container where the tree is two levels deep instead of four.
      LUXISH_ASSETS_DIR: /srv/assets
      # The mannequin figures live under the mobile app, outside this
      # service's build context, so they are mounted rather than copied.
      LUXISH_MANNEQUIN_DIR: /srv/mannequins
      # **`localhost` means this container, not the host.**
      #
      # The API fetches Keycloak's signing keys to verify every token.
      # A host-side `.env` reasonably points that at
      # `http://localhost:55080`, which inside a container resolves to
      # the container itself: the fetch fails, the verifier reports
      # `jwks_unavailable`, and every authenticated request answers
      # 401. Sign-in succeeds and nothing else works, which reads as a
      # broken app rather than one unreachable URL.
      #
      # On the compose network Keycloak answers to its service name on
      # its own port, with no host networking in the path.
      LUXISH_KEYCLOAK_JWKS_URL_OVERRIDE: http://keycloak:8080/realms/luxish/protocol/openid-connect/certs
    volumes: &backend-volumes
      # The database and generated media outlive a container, so a
      # restart does not throw away a seeded world.
      - apidata:/data
      - apimedia:/srv/.media
      # The seed photographs live at the repository root, outside
      # the build context. Read-only: the seeder reads them and the
      # container has no business writing there.
      - ../assets:/srv/assets:ro
      - ../apps/mobile/assets/images/mannequins:/srv/mannequins:ro
    ports:
      # **Configurable, because a port can be taken by nothing at all.**
      #
      # A dead process left a socket listening on `0.0.0.0:8010`. Docker
      # could not have that address, so it bound `[::]:8010` instead and
      # reported a successful publish. Every IPv4 client - the phone
      # included - then reached the leaked socket, which answered from a
      # months-old build whose workers were not running. Avatar renders
      # were accepted and never processed, and the app looked slow rather
      # than misrouted.
      #
      # `scripts/dev-stack.sh` checks that what answers on this port is
      # the build it just started, and says to set `LUXISH_API_PORT` when
      # it is not.
      - '${LUXISH_API_PORT:-8010}:8010'
    depends_on:
      redis: { condition: service_healthy }
      keycloak: { condition: service_started }
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8010/healthz']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  worker-ai:
    image: luxish-api:local
    depends_on:
      api: { condition: service_started }
    env_file: ../services/api/.env
    environment:
      <<: *backend-env
    volumes: *backend-volumes
    # Paid model work. Its own queue so a slow image call cannot
    # block a thumbnail.
    command: >
      celery -A app.queue.celery_app:celery_app worker
      --queues ai --concurrency 2 --loglevel info --pool solo
    restart: unless-stopped

  worker-media:
    image: luxish-api:local
    depends_on:
      api: { condition: service_started }
    env_file: ../services/api/.env
    environment:
      <<: *backend-env
    volumes: *backend-volumes
    command: >
      celery -A app.queue.celery_app:celery_app worker
      --queues media --concurrency 2 --loglevel info --pool solo
    restart: unless-stopped

  worker-default:
    image: luxish-api:local
    depends_on:
      api: { condition: service_started }
    env_file: ../services/api/.env
    environment:
      <<: *backend-env
    volumes: *backend-volumes
    command: >
      celery -A app.queue.celery_app:celery_app worker
      --queues default,maintenance --concurrency 2 --loglevel info --pool solo
    restart: unless-stopped

  beat:
    image: luxish-api:local
    depends_on:
      api: { condition: service_started }
    env_file: ../services/api/.env
    environment:
      <<: *backend-env
    volumes: *backend-volumes
    command: >
      celery -A app.queue.celery_app:celery_app beat --loglevel info
    restart: unless-stopped

volumes:
  apidata:
  apimedia:
  pgdata:
